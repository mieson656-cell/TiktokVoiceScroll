name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.9 }
      - name: Download Vosk RU model
        run: |
          mkdir -p app/src/main/assets
          curl -L -o m.zip https://alphacephei.com/vosk/models/vosk-model-small-ru-0.22.zip
          unzip -q m.zip
          mv vosk-model-small-ru-0.22 app/src/main/assets/model
      - run: gradle :app:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: VoiceScroll-debug-apk
          path: app/build/outputs/apk/debug/*.apk
